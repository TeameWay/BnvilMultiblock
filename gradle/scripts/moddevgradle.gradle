neoForge {
    version = libs.versions.neoForge.get()

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    addModdingDependenciesTo sourceSets.dev

    runs {
        configureEach {
            sourceSet = sourceSets.dev
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.jline', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            devLogin = true
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 测试实例只在 GameTestServer 注册，普通客户端不能注册，否则登录同步会报 Direct holder
            systemProperty 'bnvil_multiblock.tests', 'true'
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/dev/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}